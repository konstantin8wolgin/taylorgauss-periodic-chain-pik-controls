[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taylorgauss-periodic-chain-pik-controls"
version = "0.1.0"
description = "Bounded analytic Gaussian-shift controls for periodic Hubbard chains"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Konstantin Wolgin"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
sampler = ["torch>=2.6"]
test = ["pytest>=8", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
markers = [
  "slow: opt-in dense N=4,N_t=4 authority requiring about 1.25 GiB peak RSS",
]
